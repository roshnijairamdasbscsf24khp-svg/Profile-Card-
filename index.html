<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
        <div class="profile-card">

    <div class="card-banner"></div>

    <div class="profile-content">

        <div class="avatar"></div>

        <h2 class="profile-name">Roshni Kanjhwani/h2>

        <p class="profile-role">Frontend Developer</p>

        <p class="profile-bio">
            Passionate about building accessible, performant, and delightful
            web interfaces with modern CSS and JavaScript.
        </p>

        <div class="profile-stats">
            <span class="badge">CSS3</span>
            <span class="badge">JavaScript</span>
            <span class="badge">React</span>
        </div>

        <button class="follow-btn">Follow Profile</button>

    </div>

</div>
</body>
</html>
